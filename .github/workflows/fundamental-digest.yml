name: Gold Fundamental Digest (daily)

# Sends a daily gold fundamental-regime summary to Telegram (BULLISH/NEUTRAL/BEARISH
# + the DXY / yield / gold-trend signals). Runs on GitHub's servers — laptop off.
on:
  schedule:
    - cron: "0 7 * * *"       # once a day at 07:00 UTC
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send fundamental regime to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python fundamental_monitor.py --telegram
