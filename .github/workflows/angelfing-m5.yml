name: Angelfing M5 Signal

# Sinyal engulfing M5 sesi London+NY+Asia — jalan tiap 15 menit HANYA selama
# sesi supaya hemat kuota Actions. Blok UTC: London+NY 08:00-22:00 (Sen-Jum),
# Asia 23:00-07:00 (buka Minggu 23:00, tutup Sabtu 00:00 — pasar tutup Jumat
# 22:00 UTC). Run ekor 22:00/22:15 & 07:00/07:15 menangkap bar akhir sesi.
# Catatan jujur: cron GitHub sering telat 2-10 menit; ditambah delay data Yahoo,
# umur sinyal saat sampai di Telegram bisa 5-20 menit. Sinyal >20 menit di-skip
# otomatis (ANGELFING_FRESH_MIN).
# CRON DINONAKTIFKAN 2026-08-02: sinyal ANGELFING_M5 sekarang dikirim REALTIME
# oleh daemon di VPS Contabo (systemd angelfing-bot, /root/xauusd-bot, mode
# --loop, latensi ~30-90 dtk). Workflow ini disimpan sebagai FALLBACK manual —
# jalankan via workflow_dispatch kalau VPS mati. Untuk mengaktifkan cron lagi,
# un-comment blok schedule di bawah.
on:
  # schedule:
  #   - cron: "*/15 8-21 * * 1-5"   # London+NY
  #   - cron: "0,15 22 * * 1-5"     # ekor London+NY (bar 21:55)
  #   - cron: "*/15 23 * * 0-4"     # Asia mulai (Minggu-Kamis 23:00 UTC)
  #   - cron: "*/15 0-6 * * 1-5"    # Asia dini hari (Senin-Jumat)
  #   - cron: "0,15 7 * * 1-5"      # ekor Asia (bar 06:55)
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan uji koneksi ke Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: angelfing-m5
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check Angelfing M5 signal
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          TG_BALANCE:   ${{ secrets.TG_BALANCE }}
          TG_RISK:      ${{ secrets.TG_RISK }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python angelfing_signal.py --test
          else
            python angelfing_signal.py --once
          fi

      - name: Save state (dedup antar run)
        run: |
          if [ -n "$(git status --porcelain angelfing_state.json)" ]; then
            git config user.name "angelfing-bot"
            git config user.email "actions@users.noreply.github.com"
            git add angelfing_state.json
            git commit -m "update angelfing state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "no state change"
          fi
