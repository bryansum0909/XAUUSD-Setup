name: Angelfing M5 Signal

# Sinyal engulfing M5 sesi London+NY — jalan tiap 15 menit HANYA selama sesi
# (08:00-22:00 UTC, Senin-Jumat) supaya hemat kuota Actions; dua run ekstra
# jam 22:00/22:15 menangkap bar terakhir sesi (21:55) dalam jendela segar.
# Catatan jujur: cron GitHub sering telat 2-10 menit; ditambah delay data Yahoo,
# umur sinyal saat sampai di Telegram bisa 5-20 menit. Sinyal >20 menit di-skip
# otomatis (ANGELFING_FRESH_MIN).
on:
  schedule:
    - cron: "*/15 8-21 * * 1-5"
    - cron: "0,15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan uji koneksi ke Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: angelfing-m5
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check Angelfing M5 signal
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          TG_BALANCE:   ${{ secrets.TG_BALANCE }}
          TG_RISK:      ${{ secrets.TG_RISK }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python angelfing_signal.py --test
          else
            python angelfing_signal.py --once
          fi

      - name: Save state (dedup antar run)
        run: |
          if [ -n "$(git status --porcelain angelfing_state.json)" ]; then
            git config user.name "angelfing-bot"
            git config user.email "actions@users.noreply.github.com"
            git add angelfing_state.json
            git commit -m "update angelfing state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "no state change"
          fi
